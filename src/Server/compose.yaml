services:
  backend:
    build: .
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      DATA_FILE: /app/data/users.json
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - users:/app/data
    restart: unless-stopped
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health',{signal:AbortSignal.timeout(2000)}).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

volumes:
  users:
